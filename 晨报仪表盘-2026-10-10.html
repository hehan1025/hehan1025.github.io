<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>晨报仪表盘 · 2026-10-10</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-primary:#FFF9F2;--bg-card:#FFFFFF;--bg-elevated:#FFF4E6;
  --text-primary:#1A1A1A;--text-secondary:#5C5C5C;--text-muted:#8A8A8A;
  --accent:#FF6B35;--accent-hover:#E85525;--accent-light:#FFE4D6;--gold:#F7B801;
  --gradient:linear-gradient(135deg,#FF6B35 0%,#F7B801 100%);
  --gradient-soft:linear-gradient(135deg,#FFE4D6 0%,#FFF4D6 100%);
  --b-accent:#1D6FE0;--b-accent-deep:#1552A8;--b-light:#E3EEFF;--b-border:#D5E3FB;
  --b-grad:linear-gradient(135deg,#1D6FE0 0%,#2BB3C0 100%);
  --border:#F0E4D4;--border-hover:#FFB89A;
  --radius:14px;--radius-sm:8px;
  --shadow:0 4px 20px rgba(255,107,53,0.08);
  --shadow-hover:0 8px 28px rgba(255,107,53,0.16);
  --shadow-b:0 4px 20px rgba(29,111,224,0.10);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
  --font-mono:"SF Mono","Fira Code",Menlo,Consolas,monospace;
  --transition:0.25s cubic-bezier(0.4,0,0.2,1);
}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg-primary);color:var(--text-primary);line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit}
code{font-family:var(--font-mono);font-size:.86em}

/* nav */
.topnav{position:sticky;top:0;z-index:60;background:rgba(255,249,242,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.topnav-inner{max-width:1120px;margin:0 auto;padding:13px 24px;display:flex;align-items:center;gap:20px;overflow-x:auto;scrollbar-width:none}
.topnav-inner::-webkit-scrollbar{display:none}
.topnav-brand{font-weight:700;font-size:.92rem;display:flex;align-items:center;gap:8px;white-space:nowrap}
.topnav-brand .dot{width:10px;height:10px;border-radius:50%;background:var(--gradient);box-shadow:0 0 0 3px var(--accent-light);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px var(--accent-light)}50%{box-shadow:0 0 0 6px rgba(255,107,53,.15)}}
.topnav-links{display:flex;gap:4px;flex:1;align-items:center;padding-left:6px}
.topnav-links .sep{width:1px;height:16px;background:var(--border);flex-shrink:0;margin:0 8px}
.topnav-links button{appearance:none;border:0;background:transparent;cursor:pointer;font-size:.83rem;color:var(--text-secondary);padding:6px 12px;border-radius:999px;white-space:nowrap;transition:var(--transition)}
.topnav-links button:hover{background:var(--accent-light);color:var(--accent)}
.topnav-links button.active{background:var(--accent-light);color:var(--accent);font-weight:600}
.topnav-links button.b:hover{background:var(--b-light);color:var(--b-accent)}
.topnav-links button.b.active{background:var(--b-light);color:var(--b-accent)}

/* hero */
.hero{padding:72px 24px 54px;text-align:center;background:var(--gradient-soft);position:relative;overflow:hidden}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%}
.hero::before{top:-110px;right:-110px;width:320px;height:320px;background:radial-gradient(circle,rgba(255,107,53,.16) 0%,transparent 70%)}
.hero::after{bottom:-90px;left:-90px;width:260px;height:260px;background:radial-gradient(circle,rgba(247,184,1,.18) 0%,transparent 70%)}
.hero-inner{max-width:960px;margin:0 auto;position:relative;z-index:1}
.date-badge{display:inline-flex;align-items:center;gap:9px;padding:6px 16px;border-radius:999px;background:var(--bg-card);border:1px solid var(--border);font-size:.85rem;color:var(--text-secondary);margin-bottom:20px;box-shadow:var(--shadow);flex-wrap:wrap;justify-content:center}
.date-badge .live{width:8px;height:8px;border-radius:50%;background:#22C55E;animation:live-pulse 1.8s ease-out infinite;flex-shrink:0}
@keyframes live-pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}100%{box-shadow:0 0 0 10px rgba(34,197,94,0)}}
.hero h1{font-size:clamp(2.1rem,5.2vw,3.4rem);font-weight:800;letter-spacing:-1px;line-height:1.16;margin-bottom:14px}
.hero h1 .accent{background:var(--gradient);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero-tagline{font-size:clamp(.98rem,1.5vw,1.1rem);color:var(--text-secondary);margin-bottom:30px}
.hero-tagline b{color:var(--accent)}
.leadband{display:grid;grid-template-columns:1fr;gap:12px;max-width:860px;margin:0 auto 32px;text-align:left}
@media(min-width:760px){.leadband{grid-template-columns:1fr 1fr}}
.lead{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);position:relative}
.lead.a{border-left:3px solid var(--accent)}
.lead.b{border-left:3px solid var(--b-accent);box-shadow:var(--shadow-b)}
.lead .tag{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);display:inline-flex;align-items:center;gap:6px;margin-bottom:8px}
.lead.b .tag{color:var(--b-accent)}
.lead h3{font-size:.96rem;font-weight:700;line-height:1.45;margin-bottom:7px}
.lead p{font-size:.83rem;color:var(--text-secondary);line-height:1.62}
.lead .go{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:600;color:var(--accent);margin-top:10px}
.lead .go:hover{color:var(--accent-hover)}
.hero-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;max-width:860px;margin:0 auto}
.stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 12px;text-align:center;box-shadow:var(--shadow);transition:var(--transition)}
.stat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover);border-color:var(--border-hover)}
.stat-card.primary{background:var(--gradient);border-color:transparent;box-shadow:0 8px 24px rgba(255,107,53,.28)}
.stat-num{font-size:2rem;font-weight:800;font-family:var(--font-mono);line-height:1;background:var(--gradient);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat-card.primary .stat-num{background:none;-webkit-text-fill-color:#fff;color:#fff}
.stat-label{font-size:.74rem;color:var(--text-muted);margin-top:7px;letter-spacing:.4px;line-height:1.35}
.stat-card.primary .stat-label{color:rgba(255,255,255,.92)}
.stat-label em{font-style:normal;font-family:var(--font-mono);color:var(--accent);font-weight:700}
.stat-card.primary .stat-label em{color:#fff}

/* panels */
.navpanel{padding:44px 24px 10px}
.navpanel-inner,.section-inner{max-width:1120px;margin:0 auto}
.panel-title{font-size:.76rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);margin-bottom:16px;display:flex;align-items:center;gap:10px}
.panel-title::after{content:"";flex:1;height:1px;background:var(--border)}
.sources{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:22px}
@media(min-width:820px){.sources{grid-template-columns:1fr 1fr 1fr}}
.source-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);transition:var(--transition)}
.source-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover)}
.source-card.b{box-shadow:var(--shadow-b);border-color:var(--b-border)}
.source-card.m{box-shadow:0 4px 20px rgba(27,138,75,.10);border-color:#CFEBDA}
.src-tag{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.08em;padding:2px 9px;border-radius:999px;background:var(--accent-light);color:var(--accent);margin-bottom:9px}
.source-card.b .src-tag{background:var(--b-light);color:var(--b-accent)}
.source-card.m .src-tag{background:#E8F6EC;color:#1B8A4B}
.source-card h3{font-size:1rem;font-weight:700;margin-bottom:6px;letter-spacing:-.2px}
.source-card p{font-size:.83rem;color:var(--text-secondary);line-height:1.62}
.src-meta{margin-top:10px;padding-top:9px;border-top:1px dashed var(--border);font-size:.75rem;color:var(--text-muted);font-family:var(--font-mono)}
.anchors{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:760px){.anchors{grid-template-columns:1fr 1fr}}
.anchor-group{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:15px 17px;box-shadow:var(--shadow)}
.anchor-group.b{border-color:var(--b-border);box-shadow:var(--shadow-b)}
.anchor-group h4{font-size:.78rem;font-weight:700;color:var(--accent);letter-spacing:.06em;margin-bottom:11px;display:flex;align-items:center;gap:8px}
.anchor-group.b h4{color:var(--b-accent)}
.anchor-group h4 .cn{margin-left:auto;font-family:var(--font-mono);font-size:.72rem;color:var(--text-muted);font-weight:400}
.anchor-list{display:flex;flex-wrap:wrap;gap:7px}
.anchor-list a{font-size:.8rem;color:var(--text-secondary);padding:5px 12px;border-radius:999px;background:var(--bg-elevated);transition:var(--transition);white-space:nowrap}
.anchor-list a:hover{background:var(--accent-light);color:var(--accent)}
.anchor-group.b .anchor-list a{background:#F1F6FF}
.anchor-group.b .anchor-list a:hover{background:var(--b-light);color:var(--b-accent)}

/* sections */
.section{padding:56px 24px 12px;scroll-margin-top:66px}
.section-head{display:flex;align-items:baseline;gap:13px;margin-bottom:26px;padding-bottom:13px;border-bottom:2px dashed var(--border);flex-wrap:wrap}
.section-head .icon{width:34px;height:34px;border-radius:10px;background:var(--gradient);display:flex;align-items:center;justify-content:center;flex-shrink:0;align-self:center}
.section-head .icon.b{background:var(--b-grad)}
.section-head .icon svg{width:18px;height:18px;fill:#fff}
.section-head h2{font-size:1.45rem;font-weight:700;letter-spacing:-.3px}
.section-head .sub{font-size:.82rem;color:var(--text-muted);flex:1 1 220px}
.section-head .count{font-size:.78rem;font-family:var(--font-mono);background:var(--accent-light);color:var(--accent);padding:3px 11px;border-radius:999px;align-self:center;white-space:nowrap}
.section-head .count.b{background:var(--b-light);color:var(--b-accent)}
.sub{margin-bottom:34px;scroll-margin-top:66px}
.sub-head{display:flex;align-items:center;gap:10px;margin-bottom:15px}
.sub-head .marker{width:4px;height:18px;border-radius:2px;background:var(--gradient);flex-shrink:0}
.sub-head .marker.b{background:var(--b-grad)}
.sub-head h3{font-size:1.06rem;font-weight:700;letter-spacing:-.2px}
.sub-head .n{font-size:.74rem;font-family:var(--font-mono);color:var(--text-muted);background:var(--bg-elevated);padding:2px 9px;border-radius:6px}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:15px}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:19px 20px;display:flex;flex-direction:column;position:relative;overflow:hidden;transition:var(--transition)}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--gradient);transform:scaleX(0);transform-origin:left;transition:transform .3s ease}
.card:hover{border-color:var(--border-hover);box-shadow:var(--shadow-hover);transform:translateY(-3px)}
.card:hover::before{transform:scaleX(1)}
.card.b::before{background:var(--b-grad)}
.card.b:hover{border-color:#B9D2F7;box-shadow:0 8px 28px rgba(29,111,224,.16)}
.js-ready .card{opacity:0;transform:translateY(16px)}
.js-ready .card.visible{opacity:1;transform:none}
.card-num{position:absolute;top:13px;right:16px;font-family:var(--font-mono);font-size:.76rem;color:var(--text-muted);background:var(--bg-elevated);padding:2px 8px;border-radius:6px}
.card.b .card-num{background:#F1F6FF;color:var(--b-accent)}
.card-title{font-size:1rem;font-weight:600;line-height:1.45;margin-bottom:11px;padding-right:46px;letter-spacing:-.2px}
.card-title a:hover{color:var(--accent)}
.card.b .card-title a:hover{color:var(--b-accent)}
.card-source{display:inline-flex;align-items:center;gap:6px;font-size:.73rem;color:var(--text-muted);margin-bottom:10px;padding:3px 10px;background:var(--bg-elevated);border-radius:999px;align-self:flex-start;max-width:100%}
.card.b .card-source{background:#F1F6FF}
.card-source svg{width:11px;height:11px;flex-shrink:0;opacity:.65}
.card-source span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-summary{font-size:.87rem;color:var(--text-secondary);line-height:1.66;margin-bottom:13px;flex:1}
.card-subitems{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;padding-top:11px;border-top:1px dashed var(--border)}
.card-subitems a{font-size:.8rem;color:var(--b-accent);line-height:1.5;display:flex;gap:7px;align-items:flex-start}
.card-subitems a::before{content:"▸";flex-shrink:0;opacity:.6}
.card-subitems a:hover{color:var(--b-accent-deep);text-decoration:underline}
.card-link{display:inline-flex;align-items:center;gap:6px;font-size:.81rem;font-weight:600;color:var(--accent);margin-top:auto;align-self:flex-start;transition:var(--transition)}
.card.b .card-link{color:var(--b-accent)}
.card-link svg{width:14px;height:14px;transition:transform .2s ease}
.card-link:hover{color:var(--accent-hover)}
.card.b .card-link:hover{color:var(--b-accent-deep)}
.card-link:hover svg{transform:translate(2px,-2px)}
.card details{margin-top:11px;border-top:1px dashed var(--border);padding-top:9px}
.card details summary{cursor:pointer;font-size:.78rem;color:var(--text-muted);list-style:none;display:flex;align-items:center;gap:5px;user-select:none}
.card details summary::-webkit-details-marker{display:none}
.card details summary::before{content:"＋";font-weight:700;color:var(--b-accent)}
.card details[open] summary::before{content:"－"}
.card details summary:hover{color:var(--text-secondary)}
.card details .detail-body{font-size:.81rem;color:var(--text-secondary);line-height:1.72;margin-top:8px}
.card details .detail-body b{color:var(--text-primary);font-weight:600}
.empty-card{border:1px dashed var(--border);border-radius:var(--radius);padding:22px 20px;text-align:center;color:var(--text-muted);font-size:.85rem;background:rgba(255,255,255,.5)}
.empty-card span{font-size:1.2rem;display:block;margin-bottom:6px;opacity:.6}

/* cross panel */
.insight-band{background:linear-gradient(180deg,#FFFDF9 0%,#FBF7FF 100%);border-top:1px solid #EFE6F6;border-bottom:1px solid #EFE6F6}
.cross{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:26px}
@media(min-width:820px){.cross{grid-template-columns:1fr 1fr 1fr}}
.cross-block{background:var(--bg-card);border:1px solid #E6DFF5;border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.cross-block::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#FF6B35 0%,#B85CF0 50%,#1D6FE0 100%)}
.cross-block h4{font-size:.88rem;font-weight:700;margin-bottom:11px;display:flex;align-items:center;gap:8px}
.cross-block h4 .n{margin-left:auto;font-family:var(--font-mono);font-size:.72rem;color:var(--text-muted);font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.78rem;padding:4px 11px;border-radius:999px;background:linear-gradient(135deg,#FFE4D6 0%,#E3EEFF 100%);color:#5B3FA8;font-weight:600}
.chip.only{background:var(--bg-elevated);color:var(--text-secondary);font-weight:400}
.theme-row{font-size:.81rem;line-height:1.55;color:var(--text-secondary);padding:8px 0;border-bottom:1px dashed var(--border)}
.theme-row:last-child{border-bottom:0;padding-bottom:0}
.theme-row b{color:var(--text-primary);font-weight:600}
.theme-row .src{font-family:var(--font-mono);font-size:.72rem;color:var(--text-muted);display:block;margin-top:3px}
.cross-empty{font-size:.82rem;color:var(--text-muted);line-height:1.6}
.insights{display:grid;grid-template-columns:1fr;gap:15px}
@media(min-width:900px){.insights{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}}
.insight{background:var(--bg-card);border:1px solid #E6DFF5;border-radius:var(--radius);padding:19px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column;position:relative;overflow:hidden;transition:var(--transition)}
.insight::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#FF6B35 0%,#B85CF0 50%,#1D6FE0 100%)}
.insight:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(122,90,248,.16);border-color:#D8CDF2}
.insight-idx{font-family:var(--font-mono);font-size:.72rem;font-weight:700;letter-spacing:.1em;color:#7A5AF8;margin-bottom:9px}
.insight h3{font-size:1.02rem;font-weight:700;line-height:1.42;margin-bottom:13px;letter-spacing:-.2px}
.pair{display:grid;gap:9px;margin-bottom:13px}
.pair-row{display:flex;gap:9px;font-size:.82rem;line-height:1.6;color:var(--text-secondary);padding:9px 11px;border-radius:var(--radius-sm);background:var(--bg-elevated)}
.pair-row.b{background:#F1F6FF}
.pair-row .who{flex-shrink:0;font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--accent-light);color:var(--accent);height:fit-content;margin-top:2px}
.pair-row.b .who{background:var(--b-light);color:var(--b-accent)}
.insight .concl{margin-top:auto;padding-top:12px;border-top:1px dashed var(--border);font-size:.84rem;color:var(--text-primary);line-height:1.62}
.insight .concl strong{color:#7A5AF8}

/* morning band */
.band-b{background:linear-gradient(180deg,#F8FBFF 0%,#FFF9F2 100%);border-top:1px solid var(--b-border)}
.origin-note{display:flex;gap:11px;align-items:flex-start;background:var(--bg-card);border:1px solid var(--b-border);border-radius:var(--radius);padding:14px 17px;font-size:.83rem;color:var(--text-secondary);line-height:1.65;margin-bottom:26px;box-shadow:var(--shadow-b)}
.origin-note .ico{flex-shrink:0;width:26px;height:26px;border-radius:8px;background:var(--b-grad);display:flex;align-items:center;justify-content:center;font-size:.8rem}
.origin-note b{color:var(--b-accent)}
.warn-note{display:flex;gap:11px;align-items:flex-start;background:#FFF8E6;border:1px solid #F5DFA8;border-radius:var(--radius);padding:14px 17px;font-size:.83rem;color:#7A5C10;line-height:1.65;margin-bottom:26px}

/* footer */
footer{margin-top:56px;padding:38px 24px 46px;text-align:center;border-top:1px solid var(--border);background:var(--bg-elevated)}
.footer-stats{display:inline-flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;font-size:.85rem;color:var(--text-secondary)}
.footer-stats .num{font-family:var(--font-mono);font-weight:700;color:var(--accent)}
.footer-stats .sep{color:var(--border)}
.footer-source{font-size:.78rem;color:var(--text-muted);margin-top:12px;line-height:1.9}
.footer-source a{color:var(--accent);font-weight:500;border-bottom:1px solid var(--accent-light)}
.footer-source a:hover{color:var(--accent-hover)}
.footer-source .blue{color:var(--b-accent);border-bottom-color:var(--b-light)}
.totop{position:fixed;right:20px;bottom:24px;z-index:70;width:42px;height:42px;border-radius:50%;border:1px solid var(--border);background:var(--bg-card);color:var(--accent);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:var(--transition)}
.totop.show{opacity:1;pointer-events:auto}
.totop:hover{background:var(--gradient);color:#fff;border-color:transparent;transform:translateY(-2px)}

@media (max-width:768px){
  .hero{padding:52px 18px 42px}
  .section{padding:44px 18px 10px}
  .navpanel{padding:34px 18px 8px}
  .cards{grid-template-columns:1fr;gap:13px}
  .card{padding:17px}
  .topnav-inner{padding:11px 16px;gap:12px}
  .section-head h2{font-size:1.25rem}
  .section-head .sub{flex:1 1 100%;order:3}
  .insight,.cross-block{padding:17px}
  footer{padding:32px 18px 40px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.js-ready .card{opacity:1;transform:none}}
</style>
</head>
<body>

<nav class="topnav">
  <div class="topnav-inner">
    <div class="topnav-brand"><span class="dot"></span>晨报仪表盘</div>
    <div class="topnav-links" id="topnavLinks">
      <button data-target="overview" class="active">概览</button>
      <button data-target="insight">交叉洞察</button>
      <span class="sep"></span>
      <button data-target="sec-model">模型</button>
      <button data-target="sec-product">产品</button>
      <button data-target="sec-industry">行业</button>

    : 'AI HOT 数据未取到，本页仅含早间汇总';

  const totalA = A ? A.sections.reduce((n,s)=>n+s.items.length,0) : 0;
  const flashN = A ? A.flash.length : 0;
  const totalM = B ? B.sections.length : 0;
  const grand = totalA + flashN + totalM;

  document.getElementById('heroTagline').innerHTML =
    `AI HOT 精选 <b>${totalA+flashN}</b> 条，合上早间汇总 <b>${totalM}</b> 个板块 —— 共 <b>${grand}</b> 条，一份读完。`;

  const leadA = A && A.lead ? `
    <div class="lead a">
      <div class="tag">◆ AI HOT 头条</div>
      <h3>${esc(A.lead.title)}</h3>
      <p>${esc(A.lead.paragraph || A.lead.digest || '')}</p>
      <a class="go" href="${esc(A.dailyUrl)}" target="_blank" rel="noopener noreferrer">查看当日日报 ${ICON_GO}</a>
    </div>` : '';
  const leadB = B ? `
    <div class="lead b">
      <div class="tag">★ 早间汇总 · 今日最值得关注</div>
      <h3>${esc(B.headline || '—')}</h3>
      <p>来自「每日早间新闻汇总」自动化任务，覆盖时政、军事、半导体与存储、数码、汽车等 AI HOT 之外的领域。</p>
      <a class="go" href="#morning" style="color:var(--b-accent)">跳到六板块主线 ${ICON_GO}</a>
    </div>` : '';
  document.getElementById('leadband').innerHTML = leadA + leadB;

  const stats = [{num:grand,label:'全榜条数',primary:true,note:`AI 日报 ${totalA+flashN} · 早间 ${totalM}`}];
  if(A) A.sections.forEach(s=>stats.push({num:s.items.length,label:s.label,note:''}));
  stats.push({num:totalM,label:'早间汇总板块',note:''});
  document.getElementById('heroStats').innerHTML = stats.map(s=>`
    <div class="stat-card${s.primary?' primary':''}">
      <div class="stat-num">${s.num}</div>
      <div class="stat-label">${esc(s.label)}${s.note?`<br><em>${esc(s.note)}</em>`:''}</div>
    </div>`).join('');
}

function renderSources(){
  const totalA = A ? A.sections.reduce((n,s)=>n+s.items.length,0)+A.flash.length : 0;
  const srcCount = A ? new Set(A.sections.flatMap(s=>s.items.map(i=>i.source)).concat(A.flash.map(i=>i.source))).size : 0;
  const cross = DATA.cross || {};
  const ent = (cross.entities||[]).length, th = (cross.themes||[]).length;
  document.getElementById('sourceCards').innerHTML = `
    <div class="source-card">
      <span class="src-tag">源 A</span><h3>AI HOT 日报</h3>
      <p>AI 圈内部视角：模型 / 产品 / 行业 / 论文 / 观点五个固定版块，每条都带信源 chip 与原文跳转。</p>
      <div class="src-meta">${totalA} 条 · 5 版块 · ${srcCount} 家信源 · 每日自动生成</div>
    </div>
    <div class="source-card b">
      <span class="src-tag">源 B</span><h3>每日早间汇总</h3>
      <p>全局视野：时政 / AI / 军事 / 半导体与存储 / 数码 / 汽车六大板块，板块级主线 + 可展开细节。</p>
      <div class="src-meta">${B?B.sections.length:0} 板块 · 每天 ${esc(DATA.runAtLocal||'08:00')} 自动推送 · 任务 ${esc(DATA.taskId||'')}</div>
    </div>
    <div class="source-card m">
      <span class="src-tag">结合点</span><h3>共同实体 ${ent} 个 · 主题共振 ${th} 处</h3>
      <p>由脚本对两源正文做实体与主题匹配自动算出，每天变化。详见下方交叉洞察。</p>
      <div class="src-meta">合并后编号 01–${pad((A?A.sections.reduce((n,s)=>n+s.items.length,0)+A.flash.length:0)+(B?B.sections.length:0))}</div>
    </div>`;
}

function renderAnchors(){
  const totalA = A ? A.sections.reduce((n,s)=>n+s.items.length,0)+A.flash.length : 0;
  document.getElementById('anchorCountA').textContent = `${totalA} 条`;
  document.getElementById('anchorCountB').textContent = `${B?B.sections.length:0} 板块`;
  document.getElementById('anchorListA').innerHTML = A
    ? A.sections.map(s=>`<a href="#${s.id}">${esc(s.label)} <span style="opacity:.55">${s.items.length}</span></a>`).join('')
      + `<a href="#flash">速报 <span style="opacity:.55">${A.flash.length}</span></a>`
    : '<a href="#aihot">今日未取到 AI HOT 数据</a>';
  document.getElementById('anchorListB').innerHTML = B
    ? B.sections.map(s=>`<a href="#${s.id}">${esc(s.label)}</a>`).join('')
    : '<a href="#morning">今日无早间汇总数据</a>';
}

function renderCross(){
  const c = DATA.cross || {};
  const ent = c.entities||[], th = (c.themes||[]).filter(t=>t.a&&t.b);
  const onlyA = c.onlyA||[], onlyB = c.onlyB||[];
  document.getElementById('insightCount').textContent =
    `${ent.length} 实体 · ${th.length} 主题${INSIGHTS.length?` · ${INSIGHTS.length} 洞察`:''}`;

  const entHTML = ent.length
    ? `<div class="chips">${ent.map(e=>`<span class="chip">${esc(e.name)}</span>`).join('')}</div>`
    : `<p class="cross-empty">今天两源没有同时出现的实体。</p>`;

  const thHTML = th.length
    ? th.map(t=>`<div class="theme-row"><b>${esc(t.name)}</b> · AI 侧 ${t.aCount} 条 / 汇总侧 ${t.bCount} 条
        <span class="src">${esc((t.aHits||[]).concat(t.bHits||[]).slice(0,3).join(' ｜ '))}</span></div>`).join('')
    : `<p class="cross-empty">今天两源没有共同主题。</p>`;

  const onlyHTML = `
    <div class="theme-row"><b>仅 AI HOT 覆盖</b><span class="src">${esc(onlyA.slice(0,6).join(' · ')||'—')}</span></div>
    <div class="theme-row"><b>仅早间汇总覆盖</b><span class="src">${esc(onlyB.slice(0,6).join(' · ')||'—')}</span></div>`;

  document.getElementById('crossPanel').innerHTML = `
    <div class="cross-block"><h4>共同提到的实体 <span class="n">${ent.length}</span></h4>${entHTML}</div>
    <div class="cross-block"><h4>主题共振 <span class="n">${th.length}</span></h4>${thHTML}</div>
    <div class="cross-block"><h4>各自独有 <span class="n">${onlyA.length+onlyB.length}</span></h4>${onlyHTML}</div>`;

  document.getElementById('insights').innerHTML = INSIGHTS.map((it,i)=>`
    <article class="insight">
      <div class="insight-idx">INSIGHT ${pad(i+1)}</div>
      <h3>${esc(it.title)}</h3>
      <div class="pair">
        <div class="pair-row"><span class="who">AI 日报</span><span>${esc(it.a)}</span></div>
        <div class="pair-row b"><span class="who">早间汇总</span><span>${esc(it.b)}</span></div>
      </div>
      <div class="concl">${it.concl||''}</div>
    </article>`).join('');
}

function cardHTML(item, cls){
  const inner = `
      <div class="card-num">${nextNo()}</div>
      <h3 class="card-title">${item.aihot?`<a href="${esc(item.aihot)}" target="_blank" rel="noopener noreferrer">${esc(item.title)}</a>`:esc(item.title)}</h3>
      <span class="card-source">${ICON_SRC}<span>${esc(item.source)}</span></span>
      <p class="card-summary">${esc(item.digest)}</p>`;
  const link = item.original
    ? `<a class="card-link" href="${esc(item.original)}" target="_blank" rel="noopener noreferrer">阅读原文 ${ICON_GO}</a>` : '';
  return `<article class="card${cls||''}">${inner}${link}</article>`;
}

function renderAIHOT(){
  const totalA = A ? A.sections.reduce((n,s)=>n+s.items.length,0) : 0;
  document.getElementById('countA').textContent = A ? `${totalA} 条 · 编号 01–${pad(totalA)}` : '未取到数据';
  if(!A){
    document.getElementById('aihotSections').innerHTML =
      `<div class="empty-card"><span>—</span>今日未能取到 AI HOT 日报数据，本页仅展示早间汇总。</div>`;
    return;
  }
  const html = A.sections.map(s=>`
    <div class="sub" id="${s.id}">
      <div class="sub-head"><span class="marker"></span><h3>${esc(s.label)}</h3><span class="n">${s.items.length} 条</span></div>
      ${ s.items.length
        ? `<div class="cards">${s.items.map(it=>cardHTML(it,'')).join('')}</div>`
        : `<div class="empty-card"><span>—</span>今日该版块无更新</div>` }
    </div>`).join('');
  const flash = A.flash.length ? `
    <div class="sub" id="flash">
      <div class="sub-head"><span class="marker"></span><h3>⚡ 速报 Flash</h3><span class="n">${A.flash.length} 条</span></div>
      <div class="cards">${A.flash.map(it=>`
        <article class="card">
          <div class="card-num">${nextNo()}</div>
          <h3 class="card-title">${it.aihot?`<a href="${esc(it.aihot)}" target="_blank" rel="noopener noreferrer">${esc(it.title)}</a>`:esc(it.title)}</h3>
          <span class="card-source">${ICON_SRC}<span>${esc(it.source)}${it.publishedAt?` · 北京时间 ${bjMDT(it.publishedAt)}`:''}</span></span>
          <p class="card-summary">${esc(it.digest)}</p>
          ${it.original?`<a class="card-link" href="${esc(it.original)}" target="_blank" rel="noopener noreferrer">阅读原文 ${ICON_GO}</a>`:''}
        </article>`).join('')}</div>

  document.getElementById('aihotSections').innerHTML = html + flash;
}

    <div style="margin-top:10px;opacity:.75">本页由本地脚本自动生成于 ${esc(DATA.buildTimeLocal)}，单文件离线看板，样式与脚本全部内联，无任何外部资源请求。</div>`;
}

function bindNav(){
  const buttons = [...document.getElementById('topnavLinks').querySelectorAll('button')];
  buttons.forEach(b=>b.addEventListener('click',()=>{
    const el = document.getElementById(b.dataset.target);
    if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
  }));
  const map = new Map();
  buttons.forEach(b=>{ const el=document.getElementById(b.dataset.target); if(el) map.set(el,b); });
  const navBar = document.querySelector('.topnav');
  const io = new IntersectionObserver(es=>{
    es.forEach(e=>{
      if(e.isIntersecting){
        buttons.forEach(b=>b.classList.remove('active'));
        const btn = map.get(e.target); if(btn) btn.classList.add('active');
      }
    });
  },{rootMargin:`-${(navBar.offsetHeight||56)+8}px 0px -68% 0px`,threshold:0});
  map.forEach((_,el)=>io.observe(el));

  const cardIO = new IntersectionObserver((es,obs)=>{
    es.forEach((e,i)=>{ if(e.isIntersecting){ setTimeout(()=>e.target.classList.add('visible'),Math.min(i,6)*40); obs.unobserve(e.target); } });
  },{rootMargin:'0px 0px -8% 0px'});
  document.querySelectorAll('.card').forEach(c=>cardIO.observe(c));

  const top = document.getElementById('toTop');
  top.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
  window.addEventListener('scroll',()=>top.classList.toggle('show',window.scrollY>600),{passive:true});
}

document.documentElement.classList.add('js-ready');
renderHero();renderSources();renderAnchors();renderCross();renderAIHOT();renderMorning();renderFooter();
requestAnimationFrame(bindNav);
</script>
